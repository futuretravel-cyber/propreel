<!doctype html>
<!-- One honest dark theme: the half-built light mode is gone (audit §3) —
     .dark is static here, no toggle, no localStorage. -->
<html lang="en-ZA" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#800080" />
    <meta name="google-site-verification" content="L2pYI7BjU8p2xHsw7WH4r0P1fcFfBSN7wd3dhEZvgW0" />
    <title>PropReel — Create Stunning Property Videos Instantly with AI</title>
    <meta name="description" content="PropReel turns your property photos into cinematic, narrated listing reels in minutes. Built for South African estate agents. 5 Free Credits on Signup." />
    <!-- Canonical host is www; the apex redirects (308) here. -->
    <link rel="canonical" href="https://www.propreel.co.za/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PropReel" />
    <meta property="og:title" content="PropReel — Create Stunning Property Videos Instantly with AI" />
    <meta property="og:description" content="Turn property photos into cinematic, narrated listing reels in minutes. Built for SA estate agents. 5 free credits on signup." />
    <meta property="og:url" content="https://www.propreel.co.za/" />
    <meta property="og:image" content="https://www.propreel.co.za/images/og-default.png" />
    <meta property="og:image:secure_url" content="https://www.propreel.co.za/images/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PropReel — AI property videos for South African estate agents" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropReel — Property videos in minutes with AI" />
    <meta name="twitter:description" content="Cinematic, narrated listing reels for South African estate agents." />
    <meta name="twitter:image" content="https://www.propreel.co.za/images/og-default.png" />
    <meta name="twitter:image:alt" content="PropReel — AI property videos for South African estate agents" />

    <!-- Structured data: Organization + WebSite (sitewide) + SoftwareApplication -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.propreel.co.za/#organization","name":"PropReel","url":"https://www.propreel.co.za/","logo":{"@type":"ImageObject","url":"https://www.propreel.co.za/icon-512.png","width":512,"height":512},"email":"support@propreel.co.za","description":"PropReel turns property photos into cinematic, narrated listing videos for South African estate agents.","areaServed":{"@type":"Country","name":"South Africa"},"knowsLanguage":"en-ZA"},{"@type":"WebSite","@id":"https://www.propreel.co.za/#website","url":"https://www.propreel.co.za/","name":"PropReel","inLanguage":"en-ZA","publisher":{"@id":"https://www.propreel.co.za/#organization"}}]}
    </script>
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"SoftwareApplication","name":"PropReel","applicationCategory":"MultimediaApplication","operatingSystem":"Web","description":"AI property video platform for South African estate agents","publisher":{"@id":"https://www.propreel.co.za/#organization"},"offers":{"@type":"AggregateOffer","lowPrice":"129","highPrice":"5000","priceCurrency":"ZAR"}}
    </script>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PropReel" />
    <!-- Brand icons generated from the PropReel logo (scripts/generate-brand-assets.mjs) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in
         src/main.tsx) — no fonts.googleapis.com/gstatic dependency (L-3). -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      /* Status-bar safe area (replaces the deprecated
         apple-mobile-web-app-status-bar-style=black-translucent meta, which
         iOS 16+ ignores). border-box keeps the added padding from pushing
         the page past 100% height when an inset applies. */
      body { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
