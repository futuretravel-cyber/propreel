name: CI

on:
  # The gate (typecheck, pricing guard, CSP guard, security regression
  # suites) runs on EVERY push — any branch — not just main/develop.
  push:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    # Pricing guard: verifies lib/renderPricing's whole table (render tiers ×
    # durations, edit presets, flashhead per-10s blocks + 90s cap, script 1⚡)
    # with no credentials and no network. Any pricing edit that breaks the
    # shared engine (or drifts it from the docs) fails the build here.
    - name: Pricing engine dry run
      run: npx tsx scripts/pricing_paths_e2e.ts
      env:
        PRICING_E2E_ENGINE_ONLY: '1'

    - name: Build project
      run: npm run build

    # ── Security gate (audit 2026-10-25) ───────────────────────────────
    # CSP guard (M-2): shipped HTML must contain no executable inline
    # scripts / inline handlers / javascript: URLs, script-src must refuse
    # 'unsafe-inline'/'unsafe-eval', and every inline <style> block must be
    # hash-matched in style-src. Runs inside `npm run build` too; repeated
    # here as a named check so a regression is unmistakable in the UI.
    - name: CSP guard (no inline scripts, hashed styles)
      run: node scripts/check-no-inline-scripts.mjs

    # Hermetic regression suites: no network, no AWS, no Paystack, no Modal
    # calls — modules are stubbed via require.cache / sys.modules and the
    # real gate logic is what gets exercised. Red means a security gate
    # regressed; fix the gate, never the test.
    - name: "Security: Paystack verify gate (H-1)"
      run: npx tsx scripts/_paystack_verify_gate_test.ts

    - name: "Security: Paystack repeat-purchase guard"
      run: npx tsx scripts/_paystack_repeat_purchase_test.ts

    - name: "Security: leads + admin API-keys hardening (L-1/L-2)"
      run: npx tsx scripts/_leads_admin_hardening_test.ts

    # Worker hardening (M-1 fail-closed auth, L-3 CORS, L-4 no eval) drives
    # FastAPI TestClient + the parse helpers directly. Pinned to the exact
    # versions the suites were verified against locally.
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install worker test deps
      run: python -m pip install modal==1.5.5 fastapi==0.141.1 httpx==0.28.1

    - name: "Security: Modal worker hardening (M-1/L-3/L-4)"
      run: python scripts/_worker_hardening_test.py
      env:
        PYTHONUTF8: '1'

  # Browser smoke: admin access control + audit log (scripts/admin_ui_smoke.ts).
  # Drives real Chromium against the deployed site: signed-out /admin bounces
  # to /login, a signed-in NON-admin is bounced to /dashboard, the admin gets
  # in and exports one audit-log CSV. Read-only against the admin account; the
  # non-admin identity is a throwaway AGENT the smoke deletes afterwards.
  #
  # Secrets (Settings → Secrets and variables → Actions):
  #   E2E_ACCOUNT_PASSWORD       password of the admin walkthrough account
  #   E2E_ACCOUNT_EMAIL          optional (defaults to futuretravel@gmail.com)
  #   E2E_NONADMIN_ACCOUNT_EMAIL / E2E_NONADMIN_ACCOUNT_PASSWORD
  #                              optional non-admin pair — without it the smoke
  #                              provisions a throwaway AGENT itself, which
  #                              then needs the AWS_* secrets (the same ones
  #                              scripts/_ui_session.ts uses)
  admin-ui-smoke:
    name: Admin UI smoke
    needs: test
    # The trigger now covers every branch push so the security gate runs
    # everywhere; this LIVE production smoke keeps its original cadence
    # (pushes to main/develop and PRs) instead of firing on every branch.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
      E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
      E2E_SESSION_COOKIE: ${{ secrets.E2E_SESSION_COOKIE }}
      E2E_NONADMIN_ACCOUNT_EMAIL: ${{ secrets.E2E_NONADMIN_ACCOUNT_EMAIL }}
      E2E_NONADMIN_ACCOUNT_PASSWORD: ${{ secrets.E2E_NONADMIN_ACCOUNT_PASSWORD }}
      E2E_NONADMIN_SESSION_COOKIE: ${{ secrets.E2E_NONADMIN_SESSION_COOKIE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # Point vars.E2E_BASE at a Vercel preview origin to smoke a specific
      # deployment; defaults to production.
      E2E_BASE: ${{ vars.E2E_BASE || 'https://www.propreel.co.za' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # The smoke exits 2 with instructions when no identity is configured;
    # skipping here keeps forks/PRs without secrets green instead of red.
    - name: Run admin UI smoke
      if: ${{ env.E2E_ACCOUNT_PASSWORD != '' || env.E2E_SESSION_COOKIE != '' }}
      run: npm run e2e:admin-ui

    - name: Notice when smoke credentials are not configured
      if: ${{ env.E2E_ACCOUNT_PASSWORD == '' && env.E2E_SESSION_COOKIE == '' }}
      run: echo "::warning::admin-ui-smoke skipped — set the E2E_ACCOUNT_PASSWORD secret (see the job comment) to enable it"
